[workspace]
members = [
    "crates/gwen-core",
    "crates/gwen-wasm-utils",
    "crates/gwen-physics3d-fracture",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `cargo bench` inherits release. Release is tuned for WASM size (opt-level "z",
# fat LTO). Storage benches need a speed profile or the ranking is meaningless.
[profile.bench]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
strip = false

# wasm-pack 0.13 cannot select these profiles. scripts/build-wasm.sh applies the
# same settings with CARGO_PROFILE_RELEASE_*. `lto = true` on [profile.release]
# is inert: crates/gwen-core/Cargo.toml sets crate-type cdylib and rlib, and
# cargo skips LTO for that pair.
[profile.release-fast]
inherits = "release"
opt-level = 3

# Same settings as the dev-checked env overrides in scripts/build-wasm.sh.
[profile.dev-checked]
inherits = "release"
opt-level = 1
debug-assertions = true
overflow-checks = true

# Issue #80 part 1. Each member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"

