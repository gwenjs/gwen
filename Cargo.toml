[workspace]
members = [
    "crates/gwen-core",
    "crates/gwen-wasm-utils",
    "crates/gwen-physics3d-fracture",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `cargo bench` inherits release. Release is tuned for WASM size (opt-level "z",
# fat LTO). Storage benches need a speed profile or the ranking is meaningless.
[profile.bench]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
strip = false

