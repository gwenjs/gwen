name: CI

on:
  push:
    branches: [main, v1-alpha, "hardening/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Called by ci-full.yml for a full run on demand. No input, so miri_full stays empty.
  workflow_call:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      miri_full:
        description: run only the full Miri job
        type: boolean
        default: true

concurrency:
  # A Monday run, or a dispatch with miri_full, must not queue behind a push to the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event.inputs.miri_full == 'true') && '-miri' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what a run needs. A draft PR stops here and every job below is skipped.
  # push and ci-full.yml (no miri_full input) run everything ("full"). A PR runs what its diff touches.
  # A Monday schedule, or a dispatch with miri_full, runs only the Miri full job.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    outputs:
      full: ${{ steps.mode.outputs.full }}
      code: ${{ steps.mode.outputs.code }}
      rust: ${{ steps.mode.outputs.rust }}
      root: ${{ steps.mode.outputs.root }}
      stack: ${{ steps.mode.outputs.stack }}
      miri_full: ${{ steps.mode.outputs.miri_full }}
      miri_only: ${{ steps.mode.outputs.miri_only }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!notes/**'
              - '!internals-docs/**'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'wasm-size.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            root:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - 'oxlint.json'
              - '.oxfmtrc.json'
              - 'scripts/**'
              - '.github/**'
            stack:
              - '{packages/**,crates/**,scripts/stack/**,scripts/fix-dts-extensions.mjs,scripts/build-wasm.sh,pnpm-lock.yaml,pnpm-workspace.yaml,package.json,.github/workflows/ci.yml,.github/actions/**}'
              - '!**/*.md'
              - '!docs/**'
      - name: Resolve mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.filter.outputs.code }}
          RUST: ${{ steps.filter.outputs.rust }}
          ROOT: ${{ steps.filter.outputs.root }}
          STACK: ${{ steps.filter.outputs.stack }}
          MIRI_FULL: ${{ github.event.inputs.miri_full }}
        run: |
          if [ "$EVENT" = "schedule" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$MIRI_FULL" = "true" ]; }; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "root=false" >> "$GITHUB_OUTPUT"
            echo "stack=false" >> "$GITHUB_OUTPUT"
            echo "miri_full=true" >> "$GITHUB_OUTPUT"
            echo "miri_only=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "pull_request" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "root=true" >> "$GITHUB_OUTPUT"
            echo "stack=true" >> "$GITHUB_OUTPUT"
            echo "miri_full=false" >> "$GITHUB_OUTPUT"
            echo "miri_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "code=$CODE" >> "$GITHUB_OUTPUT"
            echo "rust=$RUST" >> "$GITHUB_OUTPUT"
            echo "root=$ROOT" >> "$GITHUB_OUTPUT"
            echo "stack=$STACK" >> "$GITHUB_OUTPUT"
            echo "miri_full=false" >> "$GITHUB_OUTPUT"
            echo "miri_only=false" >> "$GITHUB_OUTPUT"
          fi
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint
      - run: pnpm format:check
      - run: node scripts/check-governance.mjs

  rust:
    name: Rust tests + WASM build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The WASM build is a pure function of these files. A hit skips the build, the
      # artifacts below are still uploaded for the jobs that need them and for release.yml.
      - name: Restore WASM build
        id: wasm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            packages/core/wasm
            packages/physics3d/build-tools
            packages/physics3d/wasm/bvh
            packages/physics3d-fracture/wasm
          key: wasm-${{ runner.os }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'scripts/build-wasm*.sh', 'scripts/lib-wasm-pin.sh', 'scripts/wasm-factory.mjs', 'scripts/check-wasm-size.mjs', 'wasm-size.json') }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.wasm-cache.outputs.cache-hit != 'true' || needs.changes.outputs.rust == 'true'
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.wasm-cache.outputs.cache-hit != 'true' || needs.changes.outputs.rust == 'true'
        with:
          workspaces: '. -> target'
      - name: Install pinned wasm-pack
        if: steps.wasm-cache.outputs.cache-hit != 'true' || needs.changes.outputs.rust == 'true'
        run: |
          version=$(python3 -c 'import json; print(json.load(open("wasm-size.json"))["toolchain"]["wasmPack"])')
          cargo install wasm-pack --version "$version" --locked
      - name: Rust tests — gwen-core
        if: needs.changes.outputs.rust == 'true'
        run: cargo test -p gwen-core
      - name: Rust tests — gwen-wasm-utils
        if: needs.changes.outputs.rust == 'true'
        run: cargo test -p gwen-wasm-utils
      - name: Rust tests — gwen-core build-tools
        if: needs.changes.outputs.rust == 'true'
        run: cargo test -p gwen-core --features build-tools --test build_tools_test
      - name: Rust tests — gwen-core physics2d
        if: needs.changes.outputs.rust == 'true'
        run: cargo test -p gwen-core --features physics2d
      - name: Rust tests — gwen-core physics3d
        if: needs.changes.outputs.rust == 'true'
        run: cargo test -p gwen-core --features physics3d
      - name: Clippy disallowed methods — gwen-core
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo clippy -p gwen-core -- -A clippy::all -D clippy::disallowed_methods
          cargo clippy -p gwen-core --features physics2d --bin bench_solver_presets -- -A clippy::all -D clippy::disallowed_methods
      - name: WASM tests — gwen-core
        if: needs.changes.outputs.rust == 'true'
        run: wasm-pack test --node crates/gwen-core
      - name: Install pinned wasm-opt
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          version=$(python3 -c 'import json; print(json.load(open("wasm-size.json"))["toolchain"]["wasmOpt"])')
          url=$(python3 -c 'import json; print(json.load(open("wasm-size.json"))["binaryen"]["linux-x86_64"]["url"])')
          sha=$(python3 -c 'import json; print(json.load(open("wasm-size.json"))["binaryen"]["linux-x86_64"]["sha256"])')
          case "$url" in
            *"/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz") ;;
            *) echo "binaryen url does not match wasm-opt ${version}" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/binaryen.tar.gz "$url"
          echo "$sha  /tmp/binaryen.tar.gz" | sha256sum -c
          dest="${RUNNER_TEMP}/binaryen"
          mkdir -p "$dest"
          tar -xzf /tmp/binaryen.tar.gz -C "$dest" --strip-components=1
          echo "$dest/bin" >> "$GITHUB_PATH"
          export PATH="$dest/bin:$PATH"
          wasm-opt --version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          node-version: 22
      - name: Build WASM (all variants)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-wasm.sh
      - name: Upload build-tools artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
          retention-days: 1
      - name: Upload physics3d wasm/bvh artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
          retention-days: 1
      - name: Upload physics3d-fracture wasm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
          retention-days: 1
      - name: Upload core wasm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
          retention-days: 1

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: [changes, lint, rust]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download physics3d-fracture wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      # On a PR: typecheck and test the packages the diff touches and their dependents.
      # Full run on push, workflow_dispatch, or a root-level change (lockfile, tsconfig, scripts).
      - name: Select packages
        id: select
        env:
          FULL: ${{ needs.changes.outputs.full }}
          ROOT: ${{ needs.changes.outputs.root }}
          RUST: ${{ needs.changes.outputs.rust }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$FULL" = "true" ] || [ "$ROOT" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE"
          filters="--filter ...[origin/$BASE...HEAD]"
          # crates/** belongs to no pnpm package, but core and its dependents consume it.
          if [ "$RUST" = "true" ]; then filters="$filters --filter ...@gwenjs/core"; fi
          echo "full=false" >> "$GITHUB_OUTPUT"
          echo "filters=$filters" >> "$GITHUB_OUTPUT"
          if [ -n "$(git diff --name-only "origin/$BASE...HEAD" -- packages/core)" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Typecheck
        env:
          FULL: ${{ steps.select.outputs.full }}
          FILTERS: ${{ steps.select.outputs.filters }}
        run: |
          if [ "$FULL" = "true" ]; then pnpm typecheck; else pnpm $FILTERS exec tsc --noEmit; fi
      - name: Test packages
        env:
          FULL: ${{ steps.select.outputs.full }}
          FILTERS: ${{ steps.select.outputs.filters }}
        run: |
          if [ "$FULL" = "true" ]; then pnpm test:ts; else pnpm $FILTERS --if-present test; fi
      - name: Test WASM
        if: steps.select.outputs.full == 'true' || steps.select.outputs.core == 'true' || needs.changes.outputs.rust == 'true'
        run: pnpm test:wasm

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [changes, typescript]
    if: needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Core perf gates
        run: pnpm --filter @gwenjs/core exec vitest run --dir bench
      - name: ECS benchmarks — core
        run: pnpm bench:core:ci
      - name: Physics2D benchmarks
        run: pnpm bench:physics:ci
      - name: Physics3D timing gates
        run: pnpm bench:physics3d:ci

  api-surface:
    name: API surface
    runs-on: ubuntu-latest
    needs: [changes, rust]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download physics3d-fracture wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Add .js extensions to declaration imports
        run: node scripts/fix-dts-extensions.mjs
      - name: Dist identity
        run: node scripts/check-dist-identity.mjs
      - name: publint
        run: |
          set -euo pipefail
          for dir in packages/*; do
            private=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).private === true' "$dir/package.json")
            if [ "$private" = "true" ]; then
              continue
            fi
            pnpm exec publint run --strict "$dir"
          done
      - name: attw
        run: |
          set -euo pipefail
          for dir in packages/*; do
            private=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).private === true' "$dir/package.json")
            if [ "$private" = "true" ]; then
              continue
            fi
            pnpm exec attw --pack --profile esm-only "$dir"
          done
      - name: Public type snapshots
        run: node scripts/public-api-types.mjs

  storage-bench:
    name: Storage bench
    runs-on: ubuntu-latest
    needs: [changes, rust]
    if: needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download physics3d-fracture wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Rust storage models
        run: cargo bench -p gwen-core --bench storage_models -- --warm-up-time 1 --measurement-time 3 --noplot
      - name: TS storage models
        working-directory: packages/core
        run: pnpm exec vitest bench --run bench/storage-models.bench.ts --outputJson ../../target/storage-models.ts.json
      - name: Report
        run: node scripts/storage-bench-report.mjs
      - name: Upload storage bench
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-bench
          path: |
            target/storage-bench-summary.md
            target/storage-models.ts.json
            target/storage-bench-bytes-rust.json
            target/storage-bench-bytes-js.json
          retention-days: 7

  alloc-gate:
    name: Allocation gate
    runs-on: ubuntu-latest
    needs: [changes, rust]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22"
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Allocation gate
        run: pnpm test:alloc

  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy gwen-core physics2d
        run: cargo clippy -p gwen-core --all-targets --features physics2d -- -D warnings
      - name: Clippy gwen-core physics3d
        run: cargo clippy -p gwen-core --all-targets --features physics3d -- -D warnings
      - name: Clippy gwen-core build-tools
        run: cargo clippy -p gwen-core --all-targets --features build-tools -- -D warnings
      - name: Clippy gwen-core wasm32
        run: cargo clippy -p gwen-core --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy gwen-core wasm32 physics2d
        run: cargo clippy -p gwen-core --lib --target wasm32-unknown-unknown --features physics2d -- -D warnings
      - name: Clippy gwen-core wasm32 physics3d
        run: cargo clippy -p gwen-core --lib --target wasm32-unknown-unknown --features physics3d -- -D warnings
      - uses: ./.github/actions/setup-node-pnpm
      - name: Unsafe audit and script tests
        run: pnpm check:unsafe && pnpm test:scripts

  rust-miri:
    name: Miri
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    # x86_64 run 39031186148 job 117391793389, sha d4265ddf.
    # Cache prefix v1-miri-cold-2026-10-17. The cache step logged "No cache found."
    # Job wall 707s, 2026-10-17T12:05:54Z to 2026-10-17T12:17:41Z.
    # 2 * ceil(707/60) = 24.
    timeout-minutes: 24
    env:
      MIRI_TOOLCHAIN: nightly-2026-10-01
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-miri-cold-2026-10-17
          workspaces: '. -> target'
          cache-on-failure: true
      - name: Miri gwen-core unsafe sites and shared buffer
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --test unsafe_sites --test shared_buffer
      - name: Miri gwen-core physics2d unsafe sites
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --features physics2d --test unsafe_sites
      - name: Miri gwen-core physics3d unsafe sites
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --features physics3d --test unsafe_sites
      - name: Miri gwen-core lib unsafe_site tests
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --lib unsafe_site_
      - name: Miri gwen-core lib unsafe_site tests physics2d
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --features physics2d --lib unsafe_site_
      - name: Miri gwen-core lib unsafe_site tests physics3d
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --features physics3d --lib unsafe_site_
      - name: Miri gwen-wasm-utils
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-wasm-utils
      - name: Miri chunk store
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --lib chunk_store
      - name: Miri chunk exports, history, bulk layout, bitset, errors, alloc
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --test chunk_exports --test transform_history --test bulk_ops_layout --test bitset_total --test core_errors --test ecs_migration_alloc
      - name: Miri archetype storage without the two long tests
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --test archetype_storage -- --skip archetype_limit_leaves_the_store_unchanged --skip new_rejects_zero_and_the_limit_plus_one

  rust-miri-step:
    name: Miri physics step
    runs-on: ubuntu-24.04-arm
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    # aarch64 run 39929151171 job 120332858681, sha 38d4483a (push to hardening/184-miri-step-measure).
    # Cache prefix v1-miri-step-2026-10-23, first use of the prefix.
    # Job wall 168s, 2026-10-23T09:04:13Z to 2026-10-23T09:07:01Z.
    # 2 * ceil(168/60) = 6.
    timeout-minutes: 6
    env:
      MIRI_TOOLCHAIN: nightly-2026-10-01
      MIRIFLAGS: -Zmiri-tree-borrows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-miri-step-2026-10-23
          workspaces: '. -> target'
          cache-on-failure: true
      - name: Miri physics2d step tests
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --features physics2d --test physics_step_miri
      - name: Miri physics3d step tests
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --features physics3d --test physics_step_miri
      - name: Miri physics3d overlap export
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --features physics3d --test physics3d_overlap_bulk

  rust-miri-full:
    name: Miri full
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.miri_full == 'true'
    # Ceiling until the workflow_dispatch run of this job is measured.
    timeout-minutes: 240
    env:
      MIRI_TOOLCHAIN: nightly-2026-10-01
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1-miri-full-2026-10-23
          workspaces: '. -> target'
          cache-on-failure: true
      - name: Miri gwen-core lib and integration tests
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --lib --tests
      - name: Miri gwen-core physics2d lib and integration tests
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --features physics2d --lib --tests
      - name: Miri gwen-core physics3d lib and integration tests
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-core --features physics3d --lib --tests
      - name: Miri gwen-wasm-utils
        run: cargo +${{ env.MIRI_TOOLCHAIN }} miri test -p gwen-wasm-utils

  wasm-size:
    name: WASM size budget
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, rust]
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download physics3d-fracture wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
      - name: Check WASM size budget
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          SIZE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm check:wasm-size

  rust-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    # Cold advisory fetch on this machine, 2026-10-13: 1.08s.
    # Rust lint on run 38357504232 installed this toolchain in 32s
    # (2026-10-13T06:34:54Z to 06:35:26Z). 2 * ceil(32/60) = 2.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.99.0"
      - name: Install cargo-deny 0.20.2
        run: |
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz"
          sha=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -fsSL -o /tmp/cargo-deny.tar.gz "$url"
          echo "$sha  /tmp/cargo-deny.tar.gz" | sha256sum -c
          dest="${RUNNER_TEMP}/cargo-deny"
          mkdir -p "$dest"
          tar -xzf /tmp/cargo-deny.tar.gz -C "$dest" --strip-components=1
          echo "$dest" >> "$GITHUB_PATH"
          export PATH="$dest:$PATH"
          cargo-deny --version
      - name: cargo deny
        run: cargo deny --all-features --locked check licenses advisories bans sources

  docs-check:
    name: Docs check
