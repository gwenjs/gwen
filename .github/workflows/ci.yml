name: CI

on:
  push:
    branches: [main, v1-alpha, "hardening/**"]
  pull_request:
    branches: [main, v1-alpha, "hardening/**"]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint
      - run: pnpm format:check
      - run: node scripts/check-governance.mjs

  rust:
    name: Rust tests + WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Rust tests — gwen-core
        run: cargo test -p gwen-core
      - name: Rust tests — gwen-core physics2d
        run: cargo test -p gwen-core --features physics2d
      - name: Rust tests — gwen-core physics3d
        run: cargo test -p gwen-core --features physics3d
      - name: Clippy disallowed methods — gwen-core
        run: |
          cargo clippy -p gwen-core -- -A clippy::all -D clippy::disallowed_methods
          cargo clippy -p gwen-core --features physics2d --bin bench_solver_presets -- -A clippy::all -D clippy::disallowed_methods
      - name: WASM tests — gwen-core
        run: wasm-pack test --node crates/gwen-core
      - name: Build WASM (all variants)
        run: ./scripts/build-wasm.sh
      - name: Upload build-tools artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
          retention-days: 1
      - name: Upload physics3d wasm/bvh artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
          retention-days: 1
      - name: Upload physics3d-fracture wasm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
          retention-days: 1
      - name: Upload core wasm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
          retention-days: 1

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: [lint, rust]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download physics3d-fracture wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Test packages
        run: pnpm test:ts
      - name: Test WASM
        run: pnpm test:wasm

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [typescript]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Core perf gates
        run: pnpm --filter @gwenjs/core exec vitest run --dir bench
      - name: ECS benchmarks — core
        run: pnpm bench:core:ci
      - name: Physics2D benchmarks
        run: pnpm bench:physics:ci

  api-surface:
    name: API surface
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download physics3d-fracture wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Add .js extensions to declaration imports
        run: node scripts/fix-dts-extensions.mjs
      - name: publint
        run: |
          set -euo pipefail
          for dir in packages/*; do
            pnpm exec publint run --strict "$dir"
          done
      - name: attw
        run: |
          set -euo pipefail
          for dir in packages/*; do
            pnpm exec attw --pack --profile esm-only "$dir"
          done
      - name: Public type snapshots
        run: node scripts/public-api-types.mjs

  storage-bench:
    name: Storage bench
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download physics3d-fracture wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Rust storage models
        run: cargo bench -p gwen-core --bench storage_models -- --warm-up-time 1 --measurement-time 3 --noplot
      - name: TS storage models
        working-directory: packages/core
        run: pnpm exec vitest bench --run bench/storage-models.bench.ts --outputJson ../../target/storage-models.ts.json
      - name: Report
        run: node scripts/storage-bench-report.mjs
      - name: Upload storage bench
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-bench
          path: |
            target/storage-bench-summary.md
            target/storage-models.ts.json
            target/storage-bench-bytes-rust.json
            target/storage-bench-bytes-js.json
          retention-days: 7

  alloc-gate:
    name: Allocation gate
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22"
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Allocation gate
        run: pnpm test:alloc

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, rust, typescript, bench, api-surface, storage-bench, alloc-gate, agent-hygiene]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.lint.result }}"          != "success" ] || \
             [ "${{ needs.rust.result }}"          != "success" ] || \
             [ "${{ needs.typescript.result }}"    != "success" ] || \
             [ "${{ needs.bench.result }}"         != "success" ] || \
             [ "${{ needs.api-surface.result }}"   != "success" ] || \
             [ "${{ needs.storage-bench.result }}" != "success" ] || \
             [ "${{ needs.alloc-gate.result }}"    != "success" ] || \
             [ "${{ needs['agent-hygiene'].result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All checks passed"

  agent-hygiene:
    name: Agent hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Scanner unit tests
        run: node --test scripts/check-diff-hygiene.test.mjs scripts/check-pr-contract.test.mjs scripts/check-ci-status-needs.test.mjs scripts/commitlint-gwen.test.mjs
      - name: Diff hygiene
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: node scripts/check-diff-hygiene.mjs
      - name: PR contract
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: node scripts/check-pr-contract.mjs
      - name: ci-status needs lists every job
        run: node scripts/check-ci-status-needs.mjs
