        run: node scripts/npm-audit.mjs

  wasm-capacity:
    name: WASM capacity (${{ matrix.arch }})
    needs: [changes, rust]
    if: needs.changes.outputs.rust == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    # Run 39769490196: the slower leg (x64) took 5m24s (2026-10-22T11:19:32Z
    # to 2026-10-22T11:24:56Z), arm64 4m10s. 2 * ceil(324/60) = 12.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Kernel facts
        run: |
          uname -m
          grep -m1 'model name' /proc/cpuinfo || true
          ulimit -v
          grep -E 'Max address space' /proc/self/limits
          cat /proc/sys/vm/overcommit_memory
      - name: Capacity gate
        run: bash scripts/wasm-capacity/gate.sh packages/core/wasm
      - name: Upload capacity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-${{ matrix.arch }}.json
          path: capacity.json

  stack-pack:
    name: Stack pack
    runs-on: ubuntu-latest
    needs: [changes, rust]
    if: needs.changes.outputs.stack == 'true'
    # Run 39814389996: the job took 48s (2026-10-22T16:29:05Z to
    # 2026-10-22T16:29:53Z). 2 * ceil(48/60) = 2.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download physics3d-fracture wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Build packages
        run: pnpm build:ts
      - name: Pack the framework
        run: node scripts/stack/pack.mjs --out stack
      - name: Upload stack tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stack-tarballs
          path: stack/
          retention-days: 7
          if-no-files-found: error

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, lint, rust, rust-lint, typescript, bench, api-surface, storage-bench, alloc-gate, agent-hygiene, verify-red, rust-miri, rust-miri-step, rust-miri-full, wasm-size, rust-deny, docs-check, browser-wasm, glue-shape, npm-audit, wasm-capacity, stack-pack]
    if: always()
    steps:
      # A skipped job (draft, docs only, no Rust change, bench outside a full run) is not a failure.
      - name: Check all jobs
        run: |
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.rust.result }}" \
            "${{ needs['rust-lint'].result }}" \
            "${{ needs.typescript.result }}" \
            "${{ needs.bench.result }}" \
            "${{ needs['api-surface'].result }}" \
            "${{ needs['storage-bench'].result }}" \
            "${{ needs['alloc-gate'].result }}" \
            "${{ needs['agent-hygiene'].result }}" \
            "${{ needs['verify-red'].result }}" \
            "${{ needs['rust-miri'].result }}" \
            "${{ needs['rust-miri-step'].result }}" \
            "${{ needs['rust-miri-full'].result }}" \
            "${{ needs['wasm-size'].result }}" \
            "${{ needs['rust-deny'].result }}" \
            "${{ needs['docs-check'].result }}" \
            "${{ needs['browser-wasm'].result }}" \
            "${{ needs['glue-shape'].result }}" \
            "${{ needs['npm-audit'].result }}" \
            "${{ needs['wasm-capacity'].result }}" \
            "${{ needs['stack-pack'].result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "❌ CI failed"; exit 1 ;;
            esac
          done
          echo "✅ All checks passed"

  agent-hygiene:
    name: Agent hygiene
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.miri_only != 'true'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Scanner unit tests
        run: node --test scripts/*.test.mjs scripts/wasm-capacity/*.test.mjs
      - name: Diff hygiene
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          HYGIENE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/v1-alpha' }}
        run: node scripts/check-diff-hygiene.mjs
      - name: PR contract
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          HYGIENE_BASE: origin/${{ github.base_ref }}
        run: node scripts/check-pr-contract.mjs
      - name: ci-status needs lists every job
        run: node scripts/check-ci-status-needs.mjs

  verify-red:
    name: Verify red
    runs-on: ubuntu-latest
    needs: [changes, rust]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download build-tools artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-build-tools
          path: packages/physics3d/build-tools/
      - name: Download physics3d wasm/bvh artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-wasm-bvh
          path: packages/physics3d/wasm/bvh/
      - name: Download physics3d-fracture wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physics3d-fracture-wasm
          path: packages/physics3d-fracture/wasm/
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Verify red
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          HYGIENE_BASE: origin/${{ github.base_ref }}
        run: bash scripts/verify-red.sh
