  browser-wasm:
    name: Browser WASM (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, rust]
    if: needs.changes.outputs.code == 'true'
    # No GitHub run id: this branch was not pushed.
    # Local Mac, 2026-10-21, Playwright browsers already cached:
    #   node tests/browser/build-site.mjs            0.18s
    #   playwright install chromium firefox webkit   0.23s
    #   playwright test                              2.99s
    # ubuntu `playwright install --with-deps` is not in those numbers.
    # 2 * ceil(3.4/60) = 2 from the measured steps alone. Ceiling is 10
    # until a CI run replaces this comment with its run id.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download core wasm artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wasm
          path: packages/core/wasm/
      - name: Install Playwright browsers
        run: pnpm --filter @gwenjs/core exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: pnpm --filter @gwenjs/core test:browser
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-wasm-results
          path: packages/core/test-results
          retention-days: 1

