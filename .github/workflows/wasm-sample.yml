name: Wasm sample

on:
  workflow_dispatch:

jobs:
  sample:
    name: test:wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
      - name: Install pinned wasm-pack
        run: |
          version=$(python3 -c 'import json; print(json.load(open("wasm-size.json"))["toolchain"]["wasmPack"])')
          cargo install wasm-pack --version "$version" --locked
      - name: Install pinned wasm-opt
        run: |
          version=$(python3 -c 'import json; print(json.load(open("wasm-size.json"))["toolchain"]["wasmOpt"])')
          url=$(python3 -c 'import json; print(json.load(open("wasm-size.json"))["binaryen"]["linux-x86_64"]["url"])')
          sha=$(python3 -c 'import json; print(json.load(open("wasm-size.json"))["binaryen"]["linux-x86_64"]["sha256"])')
          case "$url" in
            *"/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz") ;;
            *) echo "binaryen url does not match wasm-opt ${version}" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/binaryen.tar.gz "$url"
          echo "$sha  /tmp/binaryen.tar.gz" | sha256sum -c
          dest="${RUNNER_TEMP}/binaryen"
          mkdir -p "$dest"
          tar -xzf /tmp/binaryen.tar.gz -C "$dest" --strip-components=1
          echo "$dest/bin" >> "$GITHUB_PATH"
          export PATH="$dest/bin:$PATH"
          wasm-opt --version
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build WASM
        run: ./scripts/build-wasm.sh
      - name: Run test:wasm
        run: pnpm --filter @gwenjs/core test:wasm
